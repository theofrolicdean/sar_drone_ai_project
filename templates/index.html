<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAR Drone Control</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            color: #333;
        }
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .controls {
            width: 350px;
            padding: 20px;
            background-color: #fff;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .display {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background-color: #e9ecef;
        }
        h1, h2 {
            color: #1c1e21;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-danger {
            background-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #c82333;
        }
        .btn-info {
            background-color: #17a2b8;
        }
        .btn-info:hover {
            background-color: #138496;
        }
        .btn-toggle {
            background-color: #6c757d;
        }
        .btn-toggle.active {
            background-color: #28a745;
        }
        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .status-box {
            margin-top: 20px;
        }
        .status-item {
            font-size: 16px;
            margin-bottom: 10px;
        }
        .status-item span {
            font-weight: bold;
            color: #495057;
        }
        #main-status-message {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            background-color: #e9ecef;
            margin-bottom: 15px;
            transition: color 0.5s;
        }
        #alert, #joystick-warning {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
            min-height: 25px;
        }
        #alert { color: #dc3545; }
        #joystick-warning { color: #ffc107; }
        #video-feed {
            max-width: 960px;
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background-color: #000;
            margin-bottom: 20px;
        }
        #map-container {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 4 / 3;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #map-canvas {
            width: 100%;
            height: 100%;
        }
        .modal {
            display: none; 
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px;
            border-radius: 8px;
            position: relative;
        }
        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <h1>Drone Control</h1>
            <button class="btn" onclick="sendCommand('takeoff')">Take Off & Search</button>
            <button class="btn btn-danger" onclick="sendCommand('land')">Land</button>
            <button id="joystick-btn" class="btn btn-toggle" onclick="sendCommand('toggle_joystick')">Toggle Joystick</button>
            <button class="btn btn-info" onclick="generateSummary()">Generate Mission Summary</button>
            
            <div class="status-box">
                <h2>Status</h2>
                <div id="main-status-message" class="status-item"><span>Connecting...</span></div>
                <div id="status-state" class="status-item">State: <span>N/A</span></div>
                <div id="status-battery" class="status-item">Battery: <span>N/A</span></div>
                <div id="status-position" class.item">Position: <span>(0, 0, 0)</span></div>
                <div id="joystick-warning"></div>
                <div id="alert"></div>
            </div>
        </div>
        <div class="display">
            <img id="video-feed" src="{{ url_for('video_feed') }}" alt="Video Feed">
            <div id="map-container">
                <canvas id="map-canvas"></canvas>
            </div>
        </div>
    </div>

    <div id="summary-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal()">&times;</span>
            <h2>Mission Summary</h2>
            <p id="summary-text">Generating...</p>
        </div>
    </div>

    <script>
        const joystickBtn = document.getElementById('joystick-btn');
        const joystickWarning = document.getElementById('joystick-warning');
        const mapCanvas = document.getElementById('map-canvas');
        const mapCtx = mapCanvas.getContext('2d');
        const modal = document.getElementById('summary-modal');
        const summaryText = document.getElementById('summary-text');
        const mainStatusMessage = document.getElementById('main-status-message').querySelector('span');
        const MAP_SIZE_METERS = 10; 

        function sendCommand(command) {
            fetch(command, { method: 'POST' })
            .then(response => response.json())
            .then(data => console.log(`${command} command success:`, data.message))
            .catch(error => console.error(`Error sending ${command} command:`, error));
        }

        function updateStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    const state = data.state;
                    document.getElementById('status-state').querySelector('span').textContent = state;
                    document.getElementById('status-battery').querySelector('span').textContent = `${data.battery}%`;
                    
                    const pos = data.position;
                    const posText = `(${pos[0].toFixed(1)}, ${pos[1].toFixed(1)}, ${pos[2].toFixed(1)})m`;
                    document.getElementById('status-position').querySelector('span').textContent = posText;

                    const alertDiv = document.getElementById('alert');
                    alertDiv.textContent = (state === 'SOS! Hovering for Rescue') ? '!!! SOS DETECTED !!!' : '';

                    // Update main status message with instructions
                    switch (state) {
                        case 'On Ground':
                            mainStatusMessage.textContent = 'Ready to fly. Press "Take Off & Search".';
                            mainStatusMessage.style.color = '#28a745';
                            break;
                        case 'Searching':
                            mainStatusMessage.textContent = 'Mission in progress: Searching...';
                            mainStatusMessage.style.color = '#007bff';
                            break;
                        case 'Tracking Survivor':
                            mainStatusMessage.textContent = 'Survivor detected! Tracking...';
                            mainStatusMessage.style.color = '#fd7e14';
                            break;
                        case 'Joystick Control':
                            mainStatusMessage.textContent = 'Manual control enabled.';
                            mainStatusMessage.style.color = '#6f42c1';
                            break;
                        case 'Landed':
                            mainStatusMessage.textContent = 'Mission complete. Drone has landed.';
                            mainStatusMessage.style.color = '#343a40';
                            break;
                        case 'Returning to Home':
                            mainStatusMessage.textContent = 'Returning to home base.';
                            mainStatusMessage.style.color = '#dc3545';
                            break;
                        default:
                            mainStatusMessage.textContent = 'Drone state is active.';
                            mainStatusMessage.style.color = '#333';
                    }

                    if (data.joystick_connected) {
                        joystickBtn.disabled = false;
                        joystickWarning.textContent = '';
                    } else {
                        joystickBtn.disabled = true;
                        joystickWarning.textContent = 'Joystick Not Connected!';
                    }
                    
                    if (data.joystick_mode) {
                        joystickBtn.classList.add('active');
                        joystickBtn.textContent = 'Joystick Mode: ON';
                    } else {
                        joystickBtn.classList.remove('active');
                        joystickBtn.textContent = 'Joystick Mode: OFF';
                    }

                    drawMap(data.drone_path, data.survivor_position);
                })
                .catch(error => {
                    console.error('Error fetching status:', error);
                    document.getElementById('status-state').querySelector('span').textContent = 'Error';
                });
        }

        function drawMap(dronePath, survivorPosition) {
            const canvasWidth = mapCanvas.width;
            const canvasHeight = mapCanvas.height;
            const scale = Math.min(canvasWidth, canvasHeight) / (MAP_SIZE_METERS * 2);

            mapCtx.clearRect(0, 0, canvasWidth, canvasHeight);
            mapCtx.strokeStyle = '#ddd';
            for (let i = -MAP_SIZE_METERS; i <= MAP_SIZE_METERS; i++) {
                mapCtx.beginPath();
                mapCtx.moveTo(canvasWidth / 2 + i * scale, 0);
                mapCtx.lineTo(canvasWidth / 2 + i * scale, canvasHeight);
                mapCtx.stroke();
                mapCtx.beginPath();
                mapCtx.moveTo(0, canvasHeight / 2 + i * scale);
                mapCtx.lineTo(canvasWidth, canvasHeight / 2 + i * scale);
                mapCtx.stroke();
            }
            
            if (dronePath && dronePath.length > 1) {
                mapCtx.strokeStyle = '#007bff';
                mapCtx.lineWidth = 2;
                mapCtx.beginPath();
                mapCtx.moveTo(canvasWidth / 2 + dronePath[0][0] * scale, canvasHeight / 2 - dronePath[0][1] * scale);
                for (let i = 1; i < dronePath.length; i++) {
                    mapCtx.lineTo(canvasWidth / 2 + dronePath[i][0] * scale, canvasHeight / 2 - dronePath[i][1] * scale);
                }
                mapCtx.stroke();
            }

            if (survivorPosition) {
                mapCtx.fillStyle = 'red';
                mapCtx.beginPath();
                mapCtx.arc(canvasWidth / 2 + survivorPosition[0] * scale, canvasHeight / 2 - survivorPosition[1] * scale, 5, 0, 2 * Math.PI);
                mapCtx.fill();
            }

            if (dronePath && dronePath.length > 0) {
                const lastPos = dronePath[dronePath.length - 1];
                mapCtx.fillStyle = 'green';
                mapCtx.beginPath();
                mapCtx.arc(canvasWidth / 2 + lastPos[0] * scale, canvasHeight / 2 - lastPos[1] * scale, 5, 0, 2 * Math.PI);
                mapCtx.fill();
            }
        }

        function generateSummary() {
            summaryText.textContent = 'Generating...';
            modal.style.display = 'block';

            fetch('/generate_summary', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    summaryText.textContent = data.error ? `Error: ${data.error}` : data.summary;
                })
                .catch(error => {
                    summaryText.textContent = `An error occurred: ${error}`;
                });
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function resizeCanvas() {
            const container = document.getElementById('map-container');
            mapCanvas.width = container.clientWidth;
            mapCanvas.height = container.clientHeight;
            updateStatus();
        }

        window.addEventListener('resize', resizeCanvas);
        
        resizeCanvas();
        setInterval(updateStatus, 1000);
        updateStatus();
    </script>
</body>
</html>
